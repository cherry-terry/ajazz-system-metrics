<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --text:#d6d6d6; --sub:#8e8e8e; --field:#3a3a3a; --line:#4a4a4a; --accent:#4ea1ff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:10px 12px 16px; font:12px/1.45 "Segoe UI", -apple-system, Arial, sans-serif; color:var(--text); background:transparent; }
  .row { display:grid; grid-template-columns: 112px 1fr; align-items:center; gap:8px; margin:7px 0; }
  .row > label { color:var(--sub); }
  select, input[type=number] { width:100%; height:24px; padding:0 6px; color:var(--text); background:var(--field); border:1px solid var(--line); border-radius:4px; font:inherit; }
  input[type=number] { width:64px; }
  .inline { display:flex; align-items:center; gap:6px; }
  .colors { display:flex; gap:10px; }
  .colors label { display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--sub); font-size:11px; }
  input[type=color] { width:36px; height:24px; padding:0; border:1px solid var(--line); border-radius:4px; background:none; cursor:pointer; }
  h3 { margin:16px 0 4px; font-size:12px; font-weight:600; color:var(--text); }
  .hint { color:var(--sub); font-size:11px; margin:2px 0 0; }
  .note { color:var(--sub); font-size:11px; margin:10px 0 4px; padding:8px 10px; border:1px solid var(--line); border-radius:4px; }
  .note button { margin-top:6px; }
  button { height:24px; padding:0 10px; color:var(--text); background:var(--field); border:1px solid var(--line); border-radius:4px; font:inherit; cursor:pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <div class="row">
    <label for="style">Style</label>
    <select id="style">
      <option value="bar">Color bar</option>
      <option value="mono">Monochrome</option>
      <option value="number">Number only</option>
      <option value="graph">15-second graph</option>
    </select>
  </div>

  <div class="row" data-for="ram vram">
    <label for="unit">Unit</label>
    <select id="unit">
      <option value="gb">Gigabytes</option>
      <option value="pct">Percent of total</option>
    </select>
  </div>

  <div class="row" data-for="disk">
    <label for="drive">Drive</label>
    <select id="drive"><option value="">All drives</option></select>
  </div>
  <div class="row" data-for="disk">
    <label for="diskView">Show</label>
    <select id="diskView">
      <option value="busy" data-os="windows">How busy the drive is</option>
      <option value="full">How full the drive is</option>
      <option value="free">Free space</option>
    </select>
  </div>

  <div class="row" data-for="vram">
    <label for="vramTotalGB">VRAM size</label>
    <div class="inline"><input id="vramTotalGB" type="number" min="0" max="256" step="1"> GB</div>
  </div>
  <p class="hint" data-for="vram" style="margin-left:120px">0 = detect automatically.</p>

  <div class="row" data-for="net">
    <label for="netView">Show</label>
    <select id="netView">
      <option value="down">Download</option>
      <option value="up">Upload</option>
      <option value="both">Both</option>
    </select>
  </div>
  <div class="row" data-for="net">
    <label for="netUnit">Unit</label>
    <select id="netUnit">
      <option value="bytes">Bytes (MB/s)</option>
      <option value="bits">Bits (Mb/s)</option>
    </select>
  </div>
  <div class="row" data-for="net">
    <label for="netMax">Full bar at</label>
    <div class="inline"><input id="netMax" type="number" min="1" max="100000" step="10"> Mbit/s</div>
  </div>
  <p class="hint" data-for="net" style="margin-left:120px">Your internet plan speed works well here.</p>

  <div class="row" data-for="battery">
    <label for="batView">Show</label>
    <select id="batView">
      <option value="pct">Charge in %</option>
      <option value="time">Time left</option>
    </select>
  </div>

  <div class="row" data-for="fps">
    <label for="fpsView">Show</label>
    <select id="fpsView">
      <option value="fps">Frames per second</option>
      <option value="ms">Frame time (ms)</option>
    </select>
  </div>
  <div class="row" data-for="fps">
    <label for="fpsMax">Full bar at</label>
    <div class="inline"><input id="fpsMax" type="number" min="10" max="1000" step="1"> fps</div>
  </div>
  <div class="note" data-for="fps">
    FPS comes from RivaTuner Statistics Server (installed with MSI Afterburner). It works on Windows only
    and needs RTSS running while you play. You install it yourself.
    <div><button id="help" type="button">How to set it up</button></div>
  </div>

  <div class="row">
    <label for="hold">Hold opens</label>
    <select id="hold"></select>
  </div>
  <p class="hint" id="tapHint" style="margin-left:120px"></p>

  <h3>Colors and thresholds</h3>
  <div class="row">
    <label for="warn" id="warnLabel">Calm below</label>
    <div class="inline"><input id="warn" type="number" min="0" max="100"> <span class="thrUnit">%</span></div>
  </div>
  <div class="row">
    <label for="crit" id="critLabel">Red from</label>
    <div class="inline"><input id="crit" type="number" min="0" max="100"> <span class="thrUnit">%</span></div>
  </div>
  <div class="row">
    <label for="peg" id="pegLabel">Glow from</label>
    <div class="inline"><input id="peg" type="number" min="0" max="101"> <span class="thrUnit">%</span></div>
  </div>
  <p class="hint" id="thrHint" style="margin-left:120px"></p>
  <div class="row">
    <label>Colors</label>
    <div class="colors">
      <label>calm<input id="calm" type="color"></label>
      <label>warm<input id="warm" type="color"></label>
      <label>load<input id="hot" type="color"></label>
    </div>
  </div>
  <div class="row">
    <span></span>
    <div><button id="reset" type="button">Restore default colors</button></div>
  </div>

<script>
const BASE = { style:'bar', warn:30, crit:85, peg:97, calm:'#3ddc5a', warm:'#ffd21f', hot:'#ff3b30',
               unit:'gb', diskView:'busy', drive:'', vramTotalGB:0, hold:'',
               netView:'down', netUnit:'bytes', netMax:500, batView:'pct', fpsView:'fps', fpsMax:144 };
// Battery and FPS are bad when low, so their thresholds count downwards.
const KIND_DEFAULTS = { battery:{ warn:50, crit:20, peg:5 }, fps:{ warn:60, crit:30, peg:0 }, net:{ warn:50, crit:90, peg:101 } };
const THRESHOLDS = {
  battery: { labels:['Calm above','Red below','Glow below'], unit:'%', max:100, hint:'Glow 0 = off.' },
  fps:     { labels:['Calm from','Red below','Glow below'], unit:'fps', max:1000, hint:'Glow 0 = off.' },
  net:     { labels:['Calm below','Red from','Glow from'], unit:'% of full bar', max:101, hint:'Glow 101 = off.' },
};
let DEFAULTS = Object.assign({}, BASE);
const DEFAULT_HOLD = { cpu:'taskmgr', ram:'taskmgr', gpu:'taskmgr', vram:'taskmgr', disk:'drive', net:'resmon', battery:'power', fps:'help' };
// [value, text, kinds that offer it (empty = all)]
const HOLD = {
  windows: [['taskmgr','Task Manager'], ['resmon','Resource Monitor'], ['drive','Drive in File Explorer',['disk']], ['storage','Storage settings',['disk']],
            ['network','Network settings',['net']], ['power','Power and battery settings',['battery']], ['help','FPS setup guide',['fps']], ['none','Nothing']],
  mac:     [['activity','Activity Monitor'], ['finder','Finder',['disk']], ['settings','System Settings: Storage',['disk']], ['sysinfo','System Information'],
            ['network','System Settings: Network',['net']], ['power','System Settings: Battery',['battery']], ['help','FPS setup guide',['fps']], ['none','Nothing']],
};
const FIELDS = ['style','unit','drive','diskView','vramTotalGB','netView','netUnit','netMax','batView','fpsView','fpsMax','hold','warn','crit','peg','calm','warm','hot'];
let ws, uuid, action, kind, platform = /Mac/i.test(navigator.userAgent) ? 'mac' : 'windows';
let settings = Object.assign({}, DEFAULTS);
const $ = id => document.getElementById(id);

function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
  uuid = inUUID;
  try { const i = JSON.parse(info); const p = i && i.application && i.application.platform; if (p) platform = /mac/i.test(p) ? 'mac' : 'windows'; } catch (_) {}
  try {
    const a = JSON.parse(actionInfo);
    action = a.action;
    kind = (action || '').split('.').pop();
    DEFAULTS = Object.assign({}, BASE, KIND_DEFAULTS[kind] || {});
    settings = Object.assign({}, DEFAULTS, (a.payload && a.payload.settings) || {});
  } catch (_) {}
  kind = (action || '').split('.').pop();
  DEFAULTS = Object.assign({}, BASE, KIND_DEFAULTS[kind] || {});
  setup();
  ws = new WebSocket('ws://127.0.0.1:' + port);
  ws.onopen = () => {
    ws.send(JSON.stringify({ event: registerEvent, uuid }));
    ws.send(JSON.stringify({ event: 'getSettings', context: uuid }));
    ws.send(JSON.stringify({ event: 'sendToPlugin', action, context: uuid, payload: { type: 'hello' } }));
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.event === 'didReceiveSettings' && m.payload) {
      settings = Object.assign({}, DEFAULTS, m.payload.settings || {});
      fill();
    } else if (m.event === 'sendToPropertyInspector' && m.payload && m.payload.type === 'info') {
      platform = m.payload.platform === 'mac' ? 'mac' : 'windows';
      setDrives(m.payload.drives || []);
      setup();
    }
  };
}
const connectSocket = connectElgatoStreamDeckSocket;

function setup() {
  document.querySelectorAll('[data-for]').forEach(el => { el.hidden = !el.dataset.for.split(' ').includes(kind); });
  document.querySelectorAll('[data-os]').forEach(el => { el.hidden = el.dataset.os !== platform; el.disabled = el.hidden; });
  const hold = $('hold'); hold.innerHTML = '';
  for (const [v, t, kinds] of HOLD[platform]) if (!kinds || kinds.includes(kind)) hold.add(new Option(t, v));
  $('drive').closest('.row').hidden = kind !== 'disk' || platform === 'mac';
  const tap = { ram: 'A tap switches between GB and %.', vram: 'A tap switches between GB and %.',
    disk: platform === 'mac' ? 'A tap switches between used and free space.' : 'A tap cycles through activity, used space and free space.',
    net: 'A tap cycles through download, upload and both.',
    battery: 'A tap switches between charge and time left.',
    fps: 'A tap switches between fps and frame time. Without RivaTuner a hold opens the setup guide.' }[kind];
  $('tapHint').textContent = 'Hold for half a second to open it.' + (tap ? ' ' + tap : '');
  const thr = THRESHOLDS[kind] || { labels:['Calm below','Red from','Glow from'], unit:'%', max:101, hint:'' };
  ['warnLabel','critLabel','pegLabel'].forEach((id, i) => { $(id).textContent = thr.labels[i]; });
  document.querySelectorAll('.thrUnit').forEach(el => { el.textContent = thr.unit; });
  ['warn','crit','peg'].forEach(id => { $(id).max = thr.max; });
  $('thrHint').textContent = thr.hint; $('thrHint').hidden = !thr.hint;
  fill();
}

function setDrives(list) {
  const sel = $('drive'); sel.innerHTML = '';
  sel.add(new Option('All drives', ''));
  for (const d of list) if (d !== '/') sel.add(new Option(d, d));
  fill();
}

function holdValue() {
  let h = settings.hold || DEFAULT_HOLD[kind] || 'taskmgr';
  if (platform === 'mac') h = { taskmgr:'activity', resmon:'activity', drive:'finder', storage:'settings' }[h] || h;
  return h;
}

function fill() {
  for (const f of FIELDS) {
    const el = $(f); if (!el) continue;
    el.value = f === 'hold' ? holdValue() : settings[f];
  }
}

function save() {
  for (const f of FIELDS) {
    const el = $(f); if (!el) continue;
    settings[f] = el.type === 'number' ? Number(el.value) : el.value;
  }
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings }));
  ws.send(JSON.stringify({ event: 'sendToPlugin', action, context: uuid, payload: { type: 'settings', settings } }));
}

FIELDS.forEach(f => { const el = $(f); el && el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', save); });
$('help').addEventListener('click', () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: 'sendToPlugin', action, context: uuid, payload: { type: 'help' } }));
});
$('reset').addEventListener('click', () => {
  for (const k of ['calm','warm','hot','warn','crit','peg']) settings[k] = DEFAULTS[k];
  fill(); save();
});
</script>
</body>
</html>
